<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" fill="none" role="img" aria-label="JFR Studios">
  <title>JFR Studios</title>
  <defs>
    <linearGradient id="goldFace" x1="8%" y1="4%" x2="92%" y2="96%">
      <stop offset="0%"   stop-color="#F7DC9B"/>
      <stop offset="22%"  stop-color="#E8C368"/>
      <stop offset="48%"  stop-color="#D4A437"/>
      <stop offset="74%"  stop-color="#B8862A"/>
      <stop offset="100%" stop-color="#8E651B"/>
    </linearGradient>

    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFF0C9"/>
      <stop offset="60%"  stop-color="#D4A437"/>
      <stop offset="100%" stop-color="#7E5714"/>
    </linearGradient>

    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- ============ MONOGRAM (scaled + centred above the wordmark) ============ -->
  <g filter="url(#lift)" transform="translate(60, 6) scale(0.82)">
    <!-- Flag / top bar: the J hook reads as the F's top arm -->
    <path fill="url(#goldFace)" d="
      M 20 18
      H 196
      C 250 18 276 46 276 92
      C 276 130 258 156 228 170
      L 244 208
      L 214 208
      L 200 174
      H 116
      V 254
      L 92 282
      L 92 174
      H 66
      L 30 236
      L 14 236
      V 174
      H 20
      V 130
      H 8
      L 8 100
      H 20
      Z" />

    <!-- Crossbar: the F's middle arm -->
    <rect x="116" y="108" width="96" height="26" fill="url(#goldFace)" />

    <!-- Floating arrow accent -->
    <path fill="url(#goldFace)" d="
      M 300 62
      H 372
      L 316 148
      V 106
      H 300
      Z" />

    <!-- Bevel highlights -->
    <path d="M 22 21 H 196 C 248 21 273 47 273 92" stroke="url(#goldEdge)" stroke-width="3.4" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M 228 170 L 243 206" stroke="url(#goldEdge)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 302 64 H 369" stroke="url(#goldEdge)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- ============ WORDMARK ============ -->
  <text
    x="240"
    y="308"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="46"
    font-weight="700"
    letter-spacing="0.015em"
    fill="url(#goldFace)"
  >JFR Studios<tspan fill="#F5F0E5" opacity="0.9" font-weight="500">.store</tspan></text>

  <!-- Hairline rule under the wordmark -->
  <path d="M 150 322 H 330" stroke="url(#goldEdge)" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
</svg>