<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C76A"/>
      <stop offset="50%" stop-color="#D4A437"/>
      <stop offset="100%" stop-color="#A87C1F"/>
    </linearGradient>
  </defs>

  <!-- Monogram mark: stylized JFR letters merged -->
  <g transform="translate(2, 4)">
    <!-- J vertical stroke -->
    <path d="M 8 6 L 8 28 Q 8 34 2 34" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- F horizontal top + middle -->
    <path d="M 16 6 L 16 34 M 16 6 L 28 6 M 16 18 L 25 18" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- R diagonal with bowl -->
    <path d="M 32 34 L 32 6 L 40 6 Q 46 6 46 12 Q 46 18 40 18 L 32 18 M 40 18 L 46 34" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Wordmark -->
  <text x="56" y="24" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" letter-spacing="0.02em" fill="url(#goldGrad)">JFR</text>
  <text x="56" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" letter-spacing="0.18em" fill="url(#goldGrad)" text-transform="uppercase">STUDIOS</text>
</svg>