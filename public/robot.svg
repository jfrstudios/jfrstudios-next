<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <radialGradient id="robotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robotBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="robotHead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </radialGradient>
  </defs>

  <!-- Outer glow -->
  <circle cx="200" cy="200" r="200" fill="url(#robotGlow)"/>

  <!-- Orbital ring 1 -->
  <ellipse cx="200" cy="200" rx="180" ry="60" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.3" transform="rotate(-25 200 200)"/>
  <ellipse cx="200" cy="200" rx="180" ry="60" stroke="#93C5FD" stroke-width="1" stroke-opacity="0.2" transform="rotate(35 200 200)"/>

  <!-- Body / Base -->
  <ellipse cx="200" cy="320" rx="80" ry="14" fill="#1E3A8A" opacity="0.5"/>
  <path
    d="M 140 270 Q 140 320 200 320 Q 260 320 260 270 L 250 250 L 150 250 Z"
    fill="url(#robotBody)"
    stroke="#93C5FD"
    stroke-width="1"
    stroke-opacity="0.4"
  />
  <!-- Body lines -->
  <line x1="160" y1="280" x2="240" y2="280" stroke="#93C5FD" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="170" y1="295" x2="230" y2="295" stroke="#93C5FD" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Neck -->
  <rect x="185" y="240" width="30" height="20" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Head -->
  <rect
    x="120"
    y="100"
    width="160"
    height="140"
    rx="40"
    fill="url(#robotHead)"
    stroke="#93C5FD"
    stroke-width="1.5"
    stroke-opacity="0.5"
  />

  <!-- Antenna -->
  <line x1="200" y1="100" x2="200" y2="70" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="62" r="8" fill="#93C5FD"/>
  <circle cx="200" cy="62" r="4" fill="#FFFFFF"/>

  <!-- Eyes -->
  <circle cx="160" cy="170" r="22" fill="url(#eyeGlow)"/>
  <circle cx="240" cy="170" r="22" fill="url(#eyeGlow)"/>
  <circle cx="160" cy="170" r="10" fill="#0A1628"/>
  <circle cx="240" cy="170" r="10" fill="#0A1628"/>
  <circle cx="164" cy="166" r="3" fill="#FFFFFF"/>
  <circle cx="244" cy="166" r="3" fill="#FFFFFF"/>

  <!-- Eye glow effect -->
  <circle cx="160" cy="170" r="30" fill="#60A5FA" opacity="0.3"/>
  <circle cx="240" cy="170" r="30" fill="#60A5FA" opacity="0.3"/>

  <!-- Mouth / Speaker -->
  <rect x="170" y="205" width="60" height="20" rx="10" fill="#0A1628" opacity="0.6"/>
  <line x1="180" y1="215" x2="220" y2="215" stroke="#60A5FA" stroke-width="1.5"/>

  <!-- Side details -->
  <circle cx="130" cy="170" r="4" fill="#93C5FD" opacity="0.6"/>
  <circle cx="270" cy="170" r="4" fill="#93C5FD" opacity="0.6"/>

  <!-- Floating particles -->
  <circle cx="80" cy="120" r="2" fill="#60A5FA" opacity="0.8"/>
  <circle cx="320" cy="140" r="2.5" fill="#93C5FD" opacity="0.7"/>
  <circle cx="100" cy="280" r="2" fill="#60A5FA" opacity="0.6"/>
  <circle cx="310" cy="290" r="2" fill="#93C5FD" opacity="0.7"/>
  <circle cx="60" cy="200" r="1.5" fill="#60A5FA" opacity="0.5"/>
  <circle cx="340" cy="220" r="1.5" fill="#93C5FD" opacity="0.5"/>
</svg>